kind: Deployment
metadata:
  name: release-name-support-service
  labels:
    helm.sh/chart: cue-0.1.0
    app.kubernetes.io/name: cue
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: support-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cue
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/name: support-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cue
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/name: support-service
    spec:
      containers:
        - name: support-service
          image: "support-service:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: release-name-cue-backend-config
            - secretRef:
                name: release-name-cue-backend-secret
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
