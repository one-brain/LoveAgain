# Source: cue/templates/postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-cue-postgres
  labels:
    helm.sh/chart: cue-0.1.0
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        helm.sh/chart: cue-0.1.0
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/version: 1.0.0
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - name: postgres
          image: postgres:15-3.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: release-name-cue-backend-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: release-name-cue-backend-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: release-name-cue-backend-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: release-name-cue-postgres-pvc
