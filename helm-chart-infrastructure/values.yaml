# Default values for cue-infrastructure.
# This chart manages infrastructure components that are stable and don't need frequent updates.

# PostgreSQL configuration
postgres:
  imageTag: "15.19"
  replicaCount: 1
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 250m
  persistence:
    enabled: false
    accessMode: ReadWriteOnce
    size: 10Gi

# RabbitMQ configuration
rabbitmq:
  imageTag: "3-management"
  replicaCount: 1
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 250m
  # Additional configuration
  vhost: "/"
  management:
    enabled: true
    plugin: rabbitmq_management
  # Persistence (optional - enable if needed)
  persistence:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi

# Redis configuration
redis:
  imageTag: "7-alpine"
  replicaCount: 1
  resources:
    limits:
      memory: 256Mi
      cpu: 250m
    requests:
      memory: 128Mi
      cpu: 100m

# PgAdmin configuration
pgAdmin:
  imageTag: "latest"
  replicaCount: 1
  resources:
    limits:
      memory: 256Mi
      cpu: 250m
    requests:
      memory: 128Mi
      cpu: 100m
  # PgAdmin default credentials (for local development only)
  defaultEmail: "admin@admin.com"
  defaultPassword: "admin"

# Global image settings
global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent

# Secret values (to be set by the user, preferably via --set-file or --set-string)
# RAW secrets (no base64 required)
secret:
  # PostgreSQL credentials
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: localsecret
  POSTGRES_DB: cue_db

  # RabbitMQ credentials
  RABBITMQ_USER: admin
  RABBITMQ_PASSWORD: localsecret

  # Redis password
  REDIS_PASSWORD: localsecret

# Service configuration for infrastructure services
service:
  type: ClusterIP
  port: 80

# Node labels for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity for pod assignment
affinity: {}