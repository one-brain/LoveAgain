apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "services.fullname" . }}-frontend
  labels:
    {{- include "services.labels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "services.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        {{- include "services.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.global.imageRegistry }}{{ if .Values.global.imageRegistry }}/{{ end }}frontend:{{ .Values.frontend.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 3000
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "services.fullname" . }}-frontend
  labels:
    {{- include "services.labels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
spec:
  selector:
    {{- include "services.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: {{ .Values.service.type | default "ClusterIP" }}